[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steelmind-export"
version = "1.0.0"
description = "Traceable planar steel-frame calculation books and design files"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "ezdxf>=1.4,<2",
  "matplotlib>=3.9,<4", "pypdfium2>=4.30,<6", "pypdf>=5,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "httpx2>=2,<3"]
langchain = ["langchain-core>=0.3,<2"]

[project.scripts]
steelmind-export = "steelmind_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steelmind_export = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
